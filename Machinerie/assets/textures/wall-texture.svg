<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <filter id="plaster" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.15" numOctaves="6" seed="42" result="noise"/>
      <feDiffuseLighting in="noise" lighting-color="#f0f0f0" surfaceScale="2" result="light">
        <feDistantLight azimuth="45" elevation="50"/>
      </feDiffuseLighting>
    </filter>
  </defs>
  <rect width="256" height="256" fill="#e8e8e4"/>
  <rect width="256" height="256" filter="url(#plaster)" opacity="0.3"/>
  <rect width="256" height="256" fill="#e8e8e4" opacity="0.7"/>
</svg>